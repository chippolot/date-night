name: Scrape, build & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 13 * * *" # 6am Pacific (5am during PST)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test

      - name: Scrape venue calendars
        # A broken scraper keeps that source's previous events rather than failing the deploy.
        run: bun run scrape
        continue-on-error: true

      - name: Commit refreshed events
        run: |
          if ! git diff --quiet data/events.generated.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: refresh scraped events" data/events.generated.json
            git push
          fi

      - id: pages
        uses: actions/configure-pages@v5
      - run: bun run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
