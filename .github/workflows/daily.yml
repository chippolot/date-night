name: Scrape, build & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 13 * * *" # 6am Pacific (5am during PST)
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test

      - name: Scrape venue calendars
        # A broken scraper keeps that source's previous events rather than failing the deploy;
        # the next step reports it in a GitHub issue instead.
        id: scrape
        run: bun run scrape
        continue-on-error: true
        # Each source has its own 5-minute timeout; this is a backstop.
        timeout-minutes: 15
        env:
          SCRAPE_REPORT: ${{ runner.temp }}/scrape-report.md
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Pushes skip sources scraped in the last 6 hours; the daily and manual runs refresh all.
          SCRAPE_FORCE: ${{ github.event_name != 'push' }}

      - name: Report scraper failures
        # One open "Scraper failures" issue: opened or commented on when sources fail,
        # closed when every source succeeds again.
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/scrape-report.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scraper failures"
          issue=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ "${{ steps.scrape.outcome }}" = "failure" ]; then
            if [ -s "$REPORT" ]; then
              body="$(cat "$REPORT")"
            else
              body="The scrape step crashed before reporting per-source results."
            fi
            body="$body"$'\n\n'"Run: $RUN_URL"
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "All scrapers succeeded in $RUN_URL"
          fi

      - name: Commit refreshed events
        run: |
          # data/cache holds per-source page caches (e.g. Shibuya HiFi) that keep later runs fast.
          git add data/events.generated.json data/cache
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: refresh scraped events"
            git push
          fi

      - id: pages
        uses: actions/configure-pages@v5
      - run: bun run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          CARTO_KEY: ${{ secrets.CARTO_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
